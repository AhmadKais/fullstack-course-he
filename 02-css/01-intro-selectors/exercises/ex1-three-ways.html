<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגיל 1 – שלוש הדרכים לשלב CSS</title>

  <!-- משימה 1: חברו כאן את הקובץ ex1-style.css -->


  <style>
    /* משימה 2: צבעו את .internal בירוק */


    /* משימה 4: הוסיפו כאן כלל ל-.conflict עם color: orange */


    /* עיצוב עזר – אל תשנו */
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; line-height: 1.6; }
    p    { border-inline-start: 4px solid #ddd; padding-inline-start: 12px; }
  </style>
</head>
<body>

  <h1>שלוש הדרכים לשלב CSS</h1>

  <p class="internal">
    הפסקה הזו צריכה להיות <strong>ירוקה</strong> – בעזרת סגנון פנימי (תגית style).
  </p>

  <!-- משימה 3: הוסיפו לפסקה הזו style="" שיצבע אותה באדום -->
  <p id="inline">
    הפסקה הזו צריכה להיות <strong>אדומה</strong> – בעזרת סגנון שורתי.
  </p>

  <p class="conflict">
    לפסקה הזו יש שני כללים מתנגשים: סגול בקובץ החיצוני, כתום בסגנון הפנימי.
    איזה ניצח?
  </p>

  <!--
    ✍️ תשובה למשימה 4:

    הצבע שניצח הוא: ______________

    למה?
    ______________________________________________________
    ______________________________________________________
  -->

</body>
</html>
