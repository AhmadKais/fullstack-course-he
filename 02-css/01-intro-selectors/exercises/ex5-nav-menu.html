</head>
<body>

  <nav class="site-nav">
    <ul>
      <li><a href="#" class="active">בית</a></li>
      <li><a href="#">קורסים</a></li>
      <li><a href="#">מרצים</a></li>
      <li><a href="#">בלוג</a></li>

      <li><input type="search" placeholder="חיפוש באתר..."></li>

  </nav>

  <main style="padding: 40px 20px;">
    <h1>תוכן הדף</h1>
    <p>העיצוב כולו צריך להגיע מהסלקטורים למעלה – בלי מחלקות נוספות ב-HTML.</p>

</html>
