<!DOCTYPE html>
<html lang="he" dir="rtl">

<!--
  ============================================
  אזור ה-HEAD: מידע *על* הדף.
  המשתמש לא רואה כלום מכאן (חוץ מהכותרת בלשונית).
  ============================================
-->
<head>
  <!-- קידוד תווים - בלי זה העברית תישבר -->
  <meta charset="UTF-8">

  <!-- תצוגה נכונה בנייד -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- תיאור הדף - מופיע בתוצאות גוגל -->
  <meta name="description" content="דף הדגמה למבנה מסמך HTML בקורס Full Stack">

  <!-- שם הכותב -->
  <meta name="author" content="צוות הקורס">

  <!-- הכותרת בלשונית הדפדפן -->
  <title>מבנה מסמך HTML</title>
</head>

<!--
  ============================================
  אזור ה-BODY: כל מה שהמשתמש רואה.
  ============================================
-->
<body>

  <h1>מבנה מסמך HTML</h1>

  <h2>מה יש ב-head?</h2>
  <p>מידע טכני: קידוד, כותרת, תיאור, קישורים לקבצי עיצוב.</p>

  <h2>מה יש ב-body?</h2>
  <p>הכותרות, הפסקאות, התמונות, הקישורים – כל התוכן הנראה.</p>

  <hr>

  <h2>נסו בעצמכם</h2>
  <p>
    פתחו את הדף הזה בדפדפן, לחצו F12, ובחרו בלשונית Elements.
    תראו את בדיוק אותו מבנה שכתבנו כאן.
  </p>

</body>
</html>
