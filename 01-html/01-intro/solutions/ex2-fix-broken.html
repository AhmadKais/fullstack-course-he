<!--
  ============================================
  פתרון תרגיל 2 – 7 השגיאות שתוקנו
  ============================================
  1. חסרה שורת <!DOCTYPE html>
  2. חסר dir="rtl" בתגית html  (העברית הוצגה משמאל לימין)
  3. חסר <meta charset="UTF-8">  (העברית הופיעה כג'יבריש)
  4. תגית <title> לא נסגרה
  5. פסקה <p> הופיעה בתוך <head> - הועברה ל-<body>
  6. <h1> נסגר עם <h1> במקום </h1>
  7. סדר סגירה הפוך: </p></strong> במקום </strong></p>
  8. חסרות מרכאות: class=intro  ->  class="intro"
  9. הפסקה האחרונה לא נסגרה עם </p>

  (יש כאן 9 תיקונים - התרגיל דיבר על 7 עיקריות,
   מי שמצא יותר - כל הכבוד!)
  ============================================
-->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הדף השבור שלי</title>
</head>
<body>

  <p>הפסקה הזו נמצאת במקום הלא נכון.</p>

  <h1>ברוכים הבאים לאתר שלי</h1>

  <p>זו פסקה עם טקסט <strong>מודגש</strong></p>

  <p class="intro">לפסקה הזו חסרות מרכאות בתכונה.</p>

  <p>שורה ראשונה<br>שורה שנייה</p>

</body>
</html>
