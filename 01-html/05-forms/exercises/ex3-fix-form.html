<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגיל 3 – תיקון טופס שבור</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 20px auto; line-height: 1.7; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 7px; box-sizing: border-box; }
  </style>
</head>
<body>

<!--
  ============================================
  בטופס הזה מסתתרות 8 שגיאות.
  מצאו ותקנו כל אחת מהן.
  ============================================
-->

  <h1>טופס הרשמה לניוזלטר</h1>

  <form action="" method="post">

    <!-- שגיאה 1 -->
    <label for="name">שם מלא</label>
    <input type="text" id="fullname" required>

    <!-- שגיאה 2 -->
    <label for="email">אימייל</label>
    <input type="text" id="email" name="email">

    <!-- שגיאה 3 -->
    <label for="age">גיל</label>
    <input type="text" id="age" name="age">

    <!-- שגיאה 4 -->
    <fieldset>
      <legend>תדירות קבלת עדכונים</legend>

      <input type="radio" id="daily" name="freq-daily" value="daily">
      <label for="daily">יומי</label>

      <input type="radio" id="weekly" name="freq-weekly" value="weekly">
      <label for="weekly">שבועי</label>

      <input type="radio" id="monthly" name="freq-monthly" value="monthly">
      <label for="monthly">חודשי</label>
    </fieldset>

    <!-- שגיאה 5 -->
    <label for="topic">תחום עניין</label>
    <select id="topic" name="topic">
      <option>-- בחרו --</option>
      <option>טכנולוגיה</option>
      <option>עיצוב</option>
      <option>עסקים</option>
    </select>

    <!-- שגיאה 6 -->
    <label for="notes">הערות</label>
    <textarea id="notes" name="notes" rows="4" value="כתבו כאן..."></textarea>

    <!-- שגיאה 7 -->
    <p>
      <input type="checkbox" id="terms" name="terms" value="yes">
      <label for="terms">אני מאשר/ת את תנאי השימוש (חובה)</label>
    </p>

    <!-- שגיאה 8 -->
    <p>
      <button>נקה טופס</button>
      <button type="submit">הרשמה</button>
    </p>

  </form>

</body>
</html>
